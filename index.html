<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./src/reset.css">
  <link rel="stylesheet" href="./src/base.css">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/css/responsive.css">
  <title>Contact form</title>

</head>

<body>
  <main>
    <div class="toast hidden" role="alert" aria-live="assertive">
      <p>Message Sent!</p>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>
    <form class="card">
      <h1>Contact Us</h1>

      <div>
        <label>First Name *
          <input type="text" class="box" required>
        </label>
        <span class="error-message" role="alert"></span>
      </div>

      <div>
        <label>Last Name *
          <input type="text" class="box" required>
        </label>
        <span class="error-message" role="alert"></span>
      </div>

      <div>
        <label>Email Address *
          <input type="email" class="box" required>
        </label>
        <span class="error-message" role="alert"></span>
      </div>

      <fieldset class="query">
        <legend>Query Type *</legend>

        <label class="query-option">
          <input type="radio" name="query" required>
          General Enquiry
        </label>

        <label class="query-option">
          <input type="radio" name="query" required>
          Support Request
        </label>
        <span class="error-message" role="alert"></span>
      </fieldset>

      <label class="message">Message *
        <textarea  class="box" required></textarea>
      </label>
      <span class="error-message" role="alert"></span>

      <label class="consent">
        <input type="checkbox" required>
        I consent to being contacted by the team *
      </label>
      <span class="error-message" role="alert"></span>

      <button class="btn" type="submit">Submit</button>

    </form>
  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Amanda Zulle</a>.
  </footer>
</body>

</html>
